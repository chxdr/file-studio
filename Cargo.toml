[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"
publish = false

[workspace.dependencies]
fstudio-model = { path = "crates/fstudio-model" }
fstudio-db = { path = "crates/fstudio-db" }
fstudio-fs = { path = "crates/fstudio-fs" }
fstudio-path = { path = "crates/fstudio-path" }
fstudio-view = { path = "crates/fstudio-view" }
fstudio-ops = { path = "crates/fstudio-ops" }
fstudio-keymap = { path = "crates/fstudio-keymap" }
fstudio-rename = { path = "crates/fstudio-rename" }
fstudio-search = { path = "crates/fstudio-search" }
fstudio-preview = { path = "crates/fstudio-preview" }
fstudio-usage = { path = "crates/fstudio-usage" }
fstudio-core = { path = "crates/fstudio-core" }
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon = "1"
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
