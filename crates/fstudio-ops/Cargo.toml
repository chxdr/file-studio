[package]
name = "fstudio-ops"
description = "File operation queue: copy/move/trash, verify, conflicts, journal and undo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets ops' fault hooks (OpsConfig::faults) reach Safe Transfer's fault points,
# for the ops test suite on the safe_transfer backend. Never in release builds.
st-faults = ["safe-transfer/fault-injection"]

[dependencies]
safe-transfer = { path = "../safe-transfer" }
fstudio-model.workspace = true
fstudio-db.workspace = true
fstudio-fs.workspace = true
thiserror.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
unicode-normalization.workspace = true
xxhash-rust.workspace = true
# Network-volume identity that survives a remount (SMB has no volume UUID).
fstudio-net = { path = "../fstudio-net" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSAutoreleasePool"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
