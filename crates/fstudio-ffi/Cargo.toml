[package]
name = "fstudio-ffi"
description = "UniFFI bindings for the File Studio core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "fstudio_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
fstudio-core.workspace = true
fstudio-model.workspace = true
fstudio-keymap.workspace = true
fstudio-ops.workspace = true
fstudio-path.workspace = true
thiserror.workspace = true
uniffi = "0.32"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
