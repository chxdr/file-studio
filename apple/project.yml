# XcodeGen spec for the File Studio macOS shell.
# Generate the project with:  cd apple && xcodegen
# The .xcodeproj is NOT committed; this file is the source of truth.
name: FileStudio
options:
  bundleIdPrefix: app.filestudio
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO          # a file manager needs the whole disk (F-011)
    # The pre-build phase runs cargo, which reads/writes outside the project dir.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"         # ad-hoc for local builds; Developer ID at release time
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES

targets:
  File Studio:
    type: application
    platform: macOS
    sources:
      - path: FileStudio
        excludes:
          - "**/README.md"
    settings:
      base:
        PRODUCT_NAME: File Studio
        PRODUCT_MODULE_NAME: FileStudio
        PRODUCT_BUNDLE_IDENTIFIER: app.filestudio.mac
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: File Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        # Liquid Glass icon from Icon Composer (FileStudio/Resources/*.icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "File Studio asks Finder to show Get Info windows, and to reveal items in Finder while File Studio is your default file viewer."
        # Declares File Studio as a folder viewer (public.folder, rank
        # Alternate), so Settings › General can make it the default; merged
        # with the generated Info.plist.
        INFOPLIST_FILE: Info-FileStudio.plist
        # Sending Apple Events (Finder's reveal and Get Info) under the
        # hardened runtime.
        CODE_SIGN_ENTITLEMENTS: FileStudio.entitlements
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "File Studio browses cards and external drives."
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: "File Studio browses network shares."
        # Rust core (F-004, Import Studio's D-024): read the UniFFI module map
        # and link the static library straight from where
        # scripts/build-core-apple.sh writes them (the RustCore target runs
        # first), so headers are never stale.
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../target/uniffi-headers"
        OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/../target/aarch64-apple-darwin/release/libfstudio_ffi.a"
      # Debug builds are a separate app: their own bundle id (so their
      # UserDefaults, window frames and setup state never reach the release
      # app's `app.filestudio.mac` domain) and their own name, which also
      # names their data folder (~/Library/Application Support/File Studio
      # Debug, see EngineFactory.swift).
      configs:
        Debug:
          PRODUCT_NAME: File Studio Debug
          PRODUCT_BUNDLE_IDENTIFIER: app.filestudio.mac.debug
          INFOPLIST_KEY_CFBundleDisplayName: File Studio Debug
          # Orange, so the Debug app is easy to tell apart in the Dock.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Debug
    dependencies:
      - target: RustCore
    scheme:
      testTargets:
        - FileStudioTests
      commandLineArguments:
        # The tests run inside the app, so keep it off the user's real data.
        "-FSMockCore": true

  # XCTest bundle, hosted inside the app so `@testable import FileStudio` works.
  # Run it with: xcodebuild test -project FileStudio.xcodeproj -scheme "File Studio"
  FileStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FileStudioTests
    dependencies:
      - target: File Studio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.filestudio.mac.tests
        # Debug builds are named "File Studio Debug" (see the app target).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/File Studio Debug.app/Contents/MacOS/File Studio Debug"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../target/uniffi-headers"

  # Builds the Rust core (static lib + Swift bindings + headers).
  RustCore:
    type: ""
    platform: macOS
    legacy:
      toolPath: /bin/sh
      arguments: "-c '\"${SRCROOT}/../scripts/build-core-apple.sh\" release'"
      passSettings: true
      workingDirectory: ""
