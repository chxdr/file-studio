# Throwaway M0 measurement spikes. NOT product code, NOT a member of any root workspace.
[workspace]

[package]
name = "fstudio-spikes"
version = "0.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
libc = "0.2"
rayon = "1"
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
notify = "8"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[profile.release]
debug = false
opt-level = 3
